stages:
  - deploy

deploy:
  stage: deploy
  only:
    - main
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H vmits1575.vm.ruhr-uni-bochum.de >> ~/.ssh/known_hosts
    - ssh sose25_g2@vmits1575.vm.ruhr-uni-bochum.de "
        cd ~/webapp2 &&
        git pull &&
        docker compose up --build -d
      "