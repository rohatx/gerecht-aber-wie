<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>GerechtAberWie</title>
    <link rel="stylesheet" href="customizableData.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="grid-wrapper">
        <h1 id="anzahlPersonen">Anzahl Personen</h1>

        <fieldset id="config" class="config">
            <div id="config-grid-wrapper">
                <h3 id="anzahlPersonenSubtitle">W&auml;hle die Anzahl der Personen aus!</h3>

                <button class="image-button" id="two-persons" onclick="changePerson(this,2)">
                    <img alt="Auswahl 2 Personen">
                </button>
                <button class="image-button" id="three-persons" onclick="changePerson(this,3)">
                    <img alt="Auswahl 3 Personen">
                </button>
                <button class="image-button" id="four-persons" onclick="changePerson(this,4)">
                    <img alt="Auswahl 4 Personen">
                </button>
                <button class="image-button" id="five-persons" onclick="changePerson(this,5)">
                    <img alt="Auswahl 5 Personen">
                </button>
                <button class="image-button" id="six-persons" onclick="changePerson(this,6)">
                    <img alt="Auswahl 6 Personen">
                </button>

                <label id="nameInputWrapper">
                    <div id="nameTag">Dein Name:</div>
                    <input type="text" id="nameInput">
                </label>
                <button class="button" id="newTaskBtn" onclick="createNewTask()">&gt; neue Aufgabe &lt;</button>
            </div>
        </fieldset>

        <fieldset id="toolbox" class="toolbox">
            <legend>Toolbox</legend>
            <form id="toolboxForm">
                <div id="toolbox-grid-wrapper">
                    <label id="moveRB">
                        <input type="radio" class="radio" name="tool" value="move" checked>
                        <div class="img-wrapper" id="move-img-wrapper"><img id="moveIMG" src="img/keksSchieben.png"
                                alt="Keks verschieben">
                            <div>Tipp: Kurz auf Kekse klicken, um mehrere Kekse zu bewegen.</div>
                        </div>
                    </label>
                    <label id="breakRB">
                        <input type="radio" class="radio" name="tool" value="break">
                        <div class="img-wrapper" id="break-img-wrapper">
                            <img id="breakIMG" alt="Keks zerbrechen">
                        </div>
                    </label>
                    <label id="mergeRB">
                        <input type="radio" class="radio" name="tool" value="merge">
                        <div class="img-wrapper" id="merge-img-wrapper">
                            <img id="mergeIMG" alt="Keks zusammenf&uuml;gen">
                        </div>
                    </label>
                    <label id="collectRB">
                        <input type="radio" class="radio" name="tool" value="collect">
                        <div class="img-wrapper" id="collect-img-wrapper">
                            <img id="collectIMG" alt="Kekse einsammeln">
                        </div>
                    </label>
                </div>
            </form>
        </fieldset>


        <h1 id="aufgabenstellung">Verteile die Kekse gerecht an alle Personen!</h1>

        <div id="circle-container">
        </div>

        <button class="button" id="checkVerteilungBtn">&gt; Verteilung Pr&uuml;fen &lt;</button>

        <div id="message"></div>
        <div id="eingabeContainer">
            Richtig! Jede Person hat jetzt die gleiche Anzahl an Keksen. Wie viele Kekse hat jeder?
            <input type="number" id="keksEingabe" min="0">
            <button class="button" id="checkAntwortBtn">&gt; Anzahl pr&uuml;fen &lt;</button>

        </div>


    </div>


</body>

</html>

<script src="script.js"></script>
