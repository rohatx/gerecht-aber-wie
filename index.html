<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Keksverteiler</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Keksverteiler</h1>
    👤 Personen: <span id="personenAnzahlAnzeige"></span>
    <input type="range" id="personenSlider" min="2" max="5" value="3">
    <br>
    🍪 Anzahl Kekse: <span id="keksAnzahlAnzeige"></span>
    <!-- <input type="range" id="keksSlider" min="1" max="20" value="9"> -->

    <div id="message"></div>

    <div id="circle-container">
    </div>

    <div id="eingabeContainer" style="display: none; margin-top: 10px;">
        Wie viele Kekse hat jede Person?
        <input type="number" id="keksEingabe" min="0">
        <button id="checkAntwortBtn">Antwort prüfen</button>
    </div>
    <div id="antwortFeedback"></div>
</body>

</html>
