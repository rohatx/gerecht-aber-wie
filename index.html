<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Gerecht, aber wie?</title>
    <link rel="stylesheet" href="customizableData.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="gridWrapper">

        <fieldset id="config" class="config">
            <div id="configGridWrapper">
                <h3 id="personNumberTitle">W&auml;hle die Anzahl der Personen aus!</h3>

                <button class="personNumberButton" id="twoPersons" onclick="changePerson(this,2)">
                    <img alt="Auswahl 2 Personen">
                </button>
                <button class="personNumberButton" id="threePersons" onclick="changePerson(this,3)">
                    <img alt="Auswahl 3 Personen">
                </button>
                <button class="personNumberButton" id="fourPersons" onclick="changePerson(this,4)">
                    <img alt="Auswahl 4 Personen">
                </button>
                <button class="personNumberButton" id="fivePersons" onclick="changePerson(this,5)">
                    <img alt="Auswahl 5 Personen">
                </button>
                <button class="personNumberButton" id="sixPersons" onclick="changePerson(this,6)">
                    <img alt="Auswahl 6 Personen">
                </button>

                <h3 id="taskTitle">Verteile die Kekse gerecht an alle Personen!</h3>

            </div>
        </fieldset>

        <fieldset id="toolbox" class="toolbox">
            <legend>Toolbox</legend>
            <form id="toolboxForm">
                <div id="toolboxGridWrapper">
                    <label id="moveRB">
                        <input type="radio" class="radio" name="tool" value="move" checked>
                        <div class="imgWrapper" id="moveImgWrapper"><img id="moveIMG" alt="Keks verschieben">
                            <div>Hinweis: Klicke kurz auf die Kekse, um mehrere gleichzeitig zu bewegen.</div>
                        </div>
                    </label>
                    <label id="breakRB">
                        <input type="radio" class="radio" name="tool" value="break">
                        <div class="imgWrapper" id="breakImgWrapper">
                            <img id="breakIMG" alt="Keks zerbrechen">
                        </div>
                    </label>
                    <label id="mergeRB">
                        <input type="radio" class="radio" name="tool" value="merge">
                        <div class="imgWrapper" id="mergeImgWrapper">
                            <img id="mergeIMG" alt="Keks zusammenf&uuml;gen">
                        </div>
                    </label>
                    <label id="collectRB">
                        <input type="radio" class="radio" name="tool" value="collect">
                        <div class="imgWrapper" id="collectImgWrapper">
                            <img id="collectIMG" alt="Kekse einsammeln">
                        </div>
                    </label>
                </div>
            </form>
        </fieldset>


        <h1 id="headline">Gerecht, aber wie?</h1>

        <div id="circleContainer">
        </div>

        <div id="cookieNumberInputContainer">
            Wie viele Kekse hat jeder?
            <input type="number" id="cookieInput" min="0">
            <button class="button" id="checkBtn" onclick="checkSolution()">Pr&uuml;fen</button>

        </div>
        <div id="messageContainer">
            <div id="message"></div>
            <button class="button" id="newTaskBtn" onclick="createNewTask()">neue Aufgabe</button>
        </div>
    </div>


</body>

</html>

<script src="script.js"></script>
