<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>GerechtAberWie</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Keksverteiler</h1>
    <h2 id="anzahlPersonen">Anzahl an Personen</h2>
    <div id="button-leiste">
        <button class="image-button" onclick="changePerson(this,2)">
        <img src="img/2personen.png" alt="Auswahl 2 Personen" >
        </button>
        <button class="image-button" onclick="changePerson(this,3)">
            <img src="img/3personen.png" alt="Auswahl 3 Personen" >
        </button>
        <button class="image-button" onclick="changePerson(this,4)">
            <img src="img/4personen.png" alt="Auswahl 4 Personen" >
        </button>
        <button class="image-button" onclick="changePerson(this,5)">
            <img src="img/5personen.png" alt="Auswahl 5 Personen" >
        </button>
        <button class="image-button" onclick="changePerson(this,6)">
            <img src="img/6personen.png" alt="Auswahl 6 Personen" >
        </button>
    </div>
    
    <div id="message"></div>

    <div id="circle-container">
    </div>

    <div id="eingabeContainer" style="display: none; margin-top: 10px;">
        Wie viele Kekse hat jede Person?
        <input type="number" id="keksEingabe" min="0">
        <button id="checkAntwortBtn">Antwort prüfen</button>
    </div>
    <div id="antwortFeedback"></div>
</body>

</html>

<script src="script.js"></script>
