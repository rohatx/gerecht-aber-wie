<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>GerechtAberWie</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="grid-wrapper">
        <button class="image-button" id="two-persons" onclick="changePerson(this,2)" style="display: none;">
            <img src="img/2personen.png" alt="Auswahl 2 Personen">
        </button>
        <button class="image-button" id="three-persons" onclick="changePerson(this,3)" style="display: none;">
            <img src="img/3personen.png" alt="Auswahl 3 Personen">
        </button>
        <button class="image-button" id="four-persons" onclick="changePerson(this,4)" style="display: none;">
            <img src="img/4personen.png" alt="Auswahl 4 Personen">
        </button>
        <button class="image-button" id="five-persons" onclick="changePerson(this,5)" style="display: none;">
            <img src="img/5personen.png" alt="Auswahl 5 Personen">
        </button>
        <button class="image-button" id="six-persons" onclick="changePerson(this,6)" style="display: none;">
            <img src="img/6personen.png" alt="Auswahl 6 Personen">
        </button>
        <h1 id="aufgabenstellung">Verteile die Kekse gerecht an alle Personen</h1>
        <h2 id="anzahlPersonen" style="display: none;">Anzahl Personen</h2>
        <h3 id="anzahlPersonenSubtitle" style="display: none;">Wähle die Anzahl der Personen aus</h3>

        <fieldset id="config" class="config">
            <label>
                Dein Name:
                <input type="text" id="nameInput">
            </label>
        </fieldset>

        <fieldset id="toolbox" class="toolbox">
            <legend>Toolbox</legend>
            <form id="toolboxForm">
                <label>
                    <input type="radio" class="radio" name="tool" value="move" checked>
                    <img src="img/keksSchieben.png" width="200px" alt="Keks verschieben">
                </label>
                <label>
                    <input type="radio" class="radio" name="tool" value="select">
                    Mehrere Kekse gleichzeitig ausw&auml;hlen.
                </label>
                <label>
                    <input type="radio" class="radio" name="tool" value="break">
                    <img src="img/keksBrechen.png" width="150px" alt="Keks zerbrechen">
                </label>
                <label>
                    <input type="radio" class="radio" name="tool" value="merge">
                    <img src="img/keksMergen.png" width="150px" alt="Keks zusammenf&uuml;gen">
                </label>
            </form>
            <button id="einsammelButton" onclick="kekseEinsammeln()">
                <img src="img/einsammeln.png" width="220px" alt="Kekse einsammeln">
            </button>
        </fieldset>



        <div id="circle-container">
        </div>

        <button id="checkVerteilungBtn">Pr&uuml;fen</button>

        <div id="message" style="display: none;"></div>
        <div id="eingabeContainer" style="margin-top: 10px;">
            Richtig! Jede Person hat jetzt die gleiche Anzahl an Keksen. Wie viele Kekse hat jeder?
            <input type="number" id="keksEingabe" min="0">
            <button id="checkAntwortBtn">Antwort pr&uuml;fen</button>

        </div>


    </div>


</body>

</html>

<script src="script.js"></script>
